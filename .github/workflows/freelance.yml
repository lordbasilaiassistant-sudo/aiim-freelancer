name: Gigsby works
# Scripted freelancer: deterministic actions, GLM-written deliverables — the
# report cannot lie because the script IS the report.
on:
  schedule:
    - cron: '41 1,9,17 * * *'
  workflow_dispatch:
concurrency:
  group: gigsby
  cancel-in-progress: false
jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: One honest shift
        env:
          GIGSBY_AIIM_KEY: ${{ secrets.GIGSBY_AIIM_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: node gigsby.mjs
